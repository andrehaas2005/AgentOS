services:
  agentos-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos}
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  agentos-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agentos:${POSTGRES_PASSWORD:-agentos}@agentos-postgres:5432/agentos
      PORT: 4000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-troque-este-segredo}
    volumes:
      - uploads:/app/uploads
    depends_on:
      agentos-postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  agentos-dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://agentos-backend:4000
        NEXT_PUBLIC_PUBLICAR_BASIC: ${NEXT_PUBLIC_PUBLICAR_BASIC:-}
    environment:
      INTERNAL_API_URL: http://agentos-backend:4000
    restart: unless-stopped
    depends_on:
      - agentos-backend
    ports:
      - "3000:3000"

  agentos-nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "80:80"
    depends_on:
      - agentos-dashboard
      - agentos-backend

volumes:
  pgdata:
  uploads:
