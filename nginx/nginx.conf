# Reverse proxy para o AgentOS.
# Ajuste server_name para o subdomínio real (ex: painel.andre.haas.nom.br)
# antes de rodar certbot na VPS para emitir o certificado HTTPS.
server {
    listen 80;
    server_name painel.andre.haas.nom.br;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://agentos-backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Publicar de verdade numa rede social é a única ação com efeito irreversível fora do
    # AgentOS — protegida com Basic Auth. As demais rotas de /api/ ficam abertas porque o
    # dashboard chama todas via fetch() do navegador sem credenciais, e um 401 aqui não
    # dispara o prompt nativo do navegador (falha silenciosa em vez de pedir login) — regex
    # location vence sobre o prefixo /api/ acima independente da ordem no arquivo.
    location ~ ^/api/conteudos/[^/]+/publicar$ {
        auth_basic "AgentOS";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://agentos-backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://agentos-backend:4000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://agentos-dashboard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
