# Reverse proxy para o AgentOS.
# Ajuste server_name para o subdomínio real (ex: painel.andre.haas.nom.br)
# antes de rodar certbot na VPS para emitir o certificado HTTPS.
server {
    listen 80;
    server_name painel.andre.haas.nom.br;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://dashboard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
