# Reverse proxy para o AgentOS.
# Ajuste server_name para o subdomínio real (ex: painel.andre.haas.nom.br)
# antes de rodar certbot na VPS para emitir o certificado HTTPS.
server {
    listen 80;
    server_name painel.andre.haas.nom.br;
    client_max_body_size 10m;

    # Toda a API agora exige sessão de login (cookie validado pelo próprio backend — ver
    # backend/src/lib/sessao.ts) em vez do Basic Auth que existia só na rota de publicar.
    # O cookie é same-origin, então o navegador manda ele sozinho em qualquer fetch() daqui.
    location /api/ {
        proxy_pass http://agentos-backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://agentos-backend:4000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://agentos-dashboard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
